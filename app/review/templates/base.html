<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{% block title %}Revisión{% endblock %}</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  header { background: #1f2937; color: white; padding: 12px 20px; }
  header a { color: #93c5fd; text-decoration: none; margin-right: 12px; }
  header a:hover { text-decoration: underline; }
  main { padding: 20px; max-width: 1600px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; background: white; }
  th, td { padding: 8px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 13px; vertical-align: top; }
  th { background: #f3f4f6; font-weight: 600; cursor: pointer; }
  tr:hover td { background: #f9fafb; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .pill.pending { background: #e5e7eb; color: #374151; }
  .pill.approved { background: #d1fae5; color: #065f46; }
  .pill.rejected { background: #fee2e2; color: #991b1b; }
  .pill.needs_fix { background: #fef3c7; color: #92400e; }
  .pill.warning { background: #fed7aa; color: #9a3412; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-bar a { padding: 6px 12px; border-radius: 4px; background: white; border: 1px solid #d1d5db; color: #374151; text-decoration: none; font-size: 13px; }
  .filter-bar a.active { background: #1f2937; color: white; border-color: #1f2937; }
  .filter-bar a .count { opacity: .6; margin-left: 4px; }
  .stem-link { color: #1d4ed8; text-decoration: none; font-weight: 500; }
  .stem-link:hover { text-decoration: underline; }
  .pages { display: flex; flex-direction: column; gap: 24px; }
  .page-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; background: white; padding: 16px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .page-row h3 { margin: 0 0 8px; font-size: 13px; color: #6b7280; font-weight: 500; }
  .page-row img { max-width: 100%; border: 1px solid #d1d5db; border-radius: 4px; display: block; }
  .doc-toolbar { position: sticky; top: 0; background: white; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; margin: -20px -20px 20px; z-index: 100; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .doc-toolbar button { padding: 6px 12px; border: 1px solid #d1d5db; background: white; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .doc-toolbar button.primary { background: #10b981; color: white; border-color: #10b981; }
  .doc-toolbar button.danger { background: #ef4444; color: white; border-color: #ef4444; }
  .doc-toolbar button.warning { background: #f59e0b; color: white; border-color: #f59e0b; }
  .meta { color: #6b7280; font-size: 12px; }
  .warn-box { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 12px; margin-bottom: 16px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <a href="/">← Cola de revisión</a>
  {% block header_extra %}{% endblock %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
