[project]
name = "anonimizador"
version = "0.1.0-dev"
description = "Anonimizador de documentos judiciales con detección role-aware y LLM clasificador"
requires-python = ">=3.10"
dependencies = [
    # I/O documentos
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    # Pipeline
    "pysbd>=0.3.4",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
ner = [
    "spacy>=3.7.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
