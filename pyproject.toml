[project]
name = "anonimizador-judicial"
version = "1.0.0"
description = "Anonimizador determinista de resoluciones judiciales argentinas (PDF/DOCX) con LLM como detector y reemplazo preservando formato."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Francisco Aguirre" },
]
keywords = [
    "anonimización",
    "anonymization",
    "legal-tech",
    "argentina",
    "jurisprudencia",
    "pdf",
    "docx",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    # I/O documentos
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    # Pipeline
    "pysbd>=0.3.4",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    # Dashboard de revisión
    "flask>=3.0.0",
]

[project.optional-dependencies]
ner = [
    "spacy>=3.7.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
anonimizador = "app.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
